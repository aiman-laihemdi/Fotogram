
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Punto Customs</title>
    <link rel="icon" href="./assets/icons/punto-logo.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/tester.css">
    <link rel="stylesheet" href="./css/fonts.css">

    <script defer src="./js/script.js"></script>
</head>

<body onload="init()">

    <header>
        <img
            class="logo-header"
            src="./assets/icons/la-costom-removebg-preview.png"
            alt="Punto Customs Logo"
        >
    </header>

    <main>
        <section class="content" aria-labelledby="main-heading">

            <div class="headline">
                <h1 id="main-heading">Punto Customs – Italian Style. Personal Touch.</h1>

                <div id="cardWrapper" class="card-wrapper"></div>
            </div>

        </section>
    </main>

    <dialog id="dialogRef" onclick="if (event.target === this) this.close()" class="dialog" aria-labelledby="nameImg">
        <div class="dialogHeader">

            <p id="nameImg"></p>

            <button type="button" id="btnClose" class="btnClose" onclick="closeDialogRef()" aria-label="Dialog schließen">✕</button>
        </div>

        <div class="dialog-img">
            <img id="dialogImg" src="" alt="">
        </div>

        <div class="btn-dialog">
            <button type="button" id="swipeLeft" onclick="previousImage()" aria-label="Vorheriges Bild">❮</button>
            <span id="imageCounter">1 / 12</span>
            <button type="button" id="swipeRight" onclick="nextImage()" aria-label="Nächstes Bild">❯</button>
        </div>
    </dialog>

    <footer>
        <img src="./assets/icons/LA_LOGO.png" alt="LA Logo">
    </footer>

</body>
</html>
